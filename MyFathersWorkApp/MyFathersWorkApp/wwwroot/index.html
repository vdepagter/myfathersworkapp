<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Father's Work Companion App</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <!-- The app is dark already: tell the browser, and keep the Dark Reader extension from recolouring the art -->
    <meta name="color-scheme" content="dark" />
    <meta name="darkreader-lock" />
    <link href="MyFathersWorkApp.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/menu-pages.css">
    <link rel="stylesheet" href="css/rankings.css">
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <div id="screen-transition" aria-hidden="true"></div>

    <script>
        // The visible window height as a CSS variable (--mfw-vh) for the frames and the Main Menu. Firefox on Android can
        // size fixed "inset: 0" layers (and svh) one toolbar height short while its toolbar slides in or out, which lifted
        // the frame's bottom border over the page; the visual viewport reports what is really on screen.
        (function () {
            const root = document.documentElement;
            let queued = false;
            function measure() {
                queued = false;
                const vv = window.visualViewport;
                const h  = vv ? vv.height * vv.scale : window.innerHeight;
                root.style.setProperty("--mfw-vh", Math.round(h) + "px");
            }
            function update() {
                if (queued) return;
                queued = true;
                requestAnimationFrame(measure);
            }
            measure();
            window.addEventListener("resize", update);
            window.addEventListener("orientationchange", () => setTimeout(update, 300));
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", update);
                window.visualViewport.addEventListener("scroll", update);
            }
            // Toolbars can finish sliding without another event
            window.addEventListener("scroll", () => setTimeout(update, 250), { passive: true });
        })();
    </script>
    <script src="js/audio.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/atmosphere.js"></script>
    <script src="js/saves.js"></script>
    <script src="js/gallery.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        // <html lang> follows the chosen language (Layout/MainLayout.razor) so the browser offers the right translation
        window.mfwSetPageLanguage = (code) => { document.documentElement.lang = code; };

        window.BlazorDownloadFile = (fileName, contentType, textData) => {
            const blob = new Blob([textData], { type: contentType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
    </script>


</body>

</html>
