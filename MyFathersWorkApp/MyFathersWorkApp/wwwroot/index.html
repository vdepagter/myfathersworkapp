<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <div id="screen-transition" aria-hidden="true"></div>

    <script>
        // The visible window height as a CSS variable (--mfw-vh) for the frames and the Main Menu. Firefox on Android can
        // size fixed "inset: 0" layers (and svh) one toolbar height short while its toolbar slides in or out, and after
        // the browser comes back from the background it can change the window without any event. So: measure on every
        // resize/scroll/return, again a few times after it, and once a second while the page is visible.
        (function () {
            const root = document.documentElement;
            let last = "";
            function measure() {
                const vv = window.visualViewport;
                const h  = Math.round(vv ? vv.height * vv.scale : window.innerHeight);
                if (!(h > 0)) return;
                const value = h + "px";
                if (value !== last) {
                    last = value;
                    root.style.setProperty("--mfw-vh", value);
                }
            }
            function settle() {
                measure();
                for (const delay of [50, 150, 350, 700, 1200, 2000]) setTimeout(measure, delay);
            }
            measure();
            window.addEventListener("resize", settle);
            window.addEventListener("orientationchange", settle);
            window.addEventListener("pageshow", settle);
            window.addEventListener("focus", settle);
            document.addEventListener("visibilitychange", () => { if (!document.hidden) settle(); });
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", settle);
                window.visualViewport.addEventListener("scroll", measure);
            }
            window.addEventListener("scroll", () => setTimeout(measure, 250), { passive: true });
            setInterval(() => { if (!document.hidden) measure(); }, 1000);

            // Viewport readout for a bug report from a phone: open the site once with ?mfwdiag in the address (kept for
            // the tab), ?mfwdiag=off removes it. Firefox on Android has misplaced the fixed layers after scrolls.
            try {
                if (/[?&]mfwdiag=off/.test(location.search)) sessionStorage.removeItem("mfwdiag");
                else if (/[?&]mfwdiag/.test(location.search)) sessionStorage.setItem("mfwdiag", "1");
                if (sessionStorage.getItem("mfwdiag")) {
                    const box = document.createElement("pre");
                    box.style.cssText = "position:fixed;left:8px;top:38%;z-index:99999;margin:0;padding:6px 8px;background:rgba(0,0,0,.8);color:#9f9;font:11px/1.35 monospace;pointer-events:none;white-space:pre";
                    document.addEventListener("DOMContentLoaded", () => document.body.appendChild(box));
                    const probes = {};
                    const probe = unit => {
                        if (!document.body) return 0;
                        if (!probes[unit]) {
                            probes[unit] = document.createElement("div");
                            probes[unit].style.cssText = "position:fixed;left:0;top:0;width:0;visibility:hidden;pointer-events:none;height:100" + unit;
                            document.body.appendChild(probes[unit]);
                        }
                        return probes[unit].getBoundingClientRect().height;
                    };
                    const top = selector => { const e = document.querySelector(selector); if (!e) return "-"; const r = e.getBoundingClientRect(); return Math.round(r.top) + " h" + Math.round(r.height); };
                    setInterval(() => {
                        const vv = window.visualViewport, d = document.documentElement;
                        box.textContent = [
                            "inner " + innerWidth + "x" + innerHeight + "  client h" + d.clientHeight,
                            "vv " + (vv ? Math.round(vv.width) + "x" + Math.round(vv.height) + " off " + vv.offsetTop.toFixed(1) + " page " + vv.pageTop.toFixed(1) + " scale " + vv.scale.toFixed(2) : "none"),
                            "scrollY " + scrollY.toFixed(1) + " max " + (d.scrollHeight - d.clientHeight) + "  --mfw-vh " + last,
                            "lvh " + Math.round(probe("lvh")) + "  svh " + Math.round(probe("svh")) + "  max(lvh) " + Math.round(d.scrollHeight - Math.max(d.clientHeight, innerHeight, probe("lvh"))),
                            "frame " + top(".game-frame") + "  header " + top(".header-buttons") + "  scene " + top(".game-scene"),
                            "readout top " + Math.round(box.getBoundingClientRect().top) + "  " + new Date().toLocaleTimeString()
                        ].join(String.fromCharCode(10));
                    }, 250);
                }
            } catch (e) { /* storage blocked */ }
        })();
    </script>
    <script src="js/edition.js"></script>
    <script src="js/narration-sync.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/atmosphere.js"></script>
    <script src="js/saves.js"></script>
    <script src="js/gallery.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        // <html lang> follows the chosen language (Layout/MainLayout.razor) so the browser offers the right translation
        window.mfwSetPageLanguage = (code) => { document.documentElement.lang = code; };

        window.BlazorDownloadFile = (fileName, contentType, textData) => {
            const blob = new Blob([textData], { type: contentType });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        };
    </script>


</body>

</html>
