name: Windows release

# Builds the offline Windows version (tools/build-windows.ps1): MyFathersWork.exe + wwwroot, as three zips: full,
# light (smaller audio) and no-audio, kept as a workflow artifact (Actions > Windows release > Run workflow).
# These builds are NOT code-signed: the signing key lives in Certum's cloud and only works on the owner's laptop.
# Published releases are built and signed there: pwsh tools/build-windows.ps1 -Sign -Publish
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed to count commits for the version number
          lfs: false

      # Same LFS cache as deploy-pages.yml: only the web app's files, keyed by their object ids
      - name: List LFS objects of the web app
        shell: bash
        run: git lfs ls-files --long --include "MyFathersWorkApp/**" > lfs-objects.txt

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('lfs-objects.txt') }}
          restore-keys: lfs-

      - name: Pull LFS files of the web app
        run: git lfs pull --include "MyFathersWorkApp/**"

      # Version as in deploy-pages.yml: 0.66.6.<commits on main (first parent) since 3d78856, minus 1>
      - name: Compute version
        shell: bash
        run: |
          REVISION=$(( $(git rev-list --count --first-parent 3d78856..HEAD) - 1 ))
          if [ "$REVISION" -lt 0 ]; then REVISION=0; fi
          echo "VERSION=0.66.6.$REVISION" >> "$GITHUB_ENV"
          echo "Version 0.66.6.$REVISION"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # The light edition re-encodes the audio
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Build the Windows release
        shell: pwsh
        run: ./tools/build-windows.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: MyFathersWork-Windows-${{ env.VERSION }}
          path: dist/MyFathersWork-Windows-${{ env.VERSION }}*.zip
          compression-level: 0 # already a zip
