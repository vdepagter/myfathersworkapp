name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed to count commits for the version number
          lfs: false

      # Images and audio are stored in Git LFS. Only pull the web app's files, not UnityOriginalApp/ (saves LFS bandwidth).
      # The LFS objects are cached between runs: the key is the list of object ids (content hashes), so a changed or new
      # file gives a new key, the previous cache is restored via restore-keys and only the new objects are downloaded.
      # Nothing to clear by hand, file names can stay the same.
      - name: List LFS objects of the web app
        run: git lfs ls-files --long --include "MyFathersWorkApp/**" > lfs-objects.txt # hashFiles only reads the workspace

      - name: Restore LFS cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('lfs-objects.txt') }}
          restore-keys: lfs-

      - name: Pull LFS files of the web app
        run: git lfs pull --include "MyFathersWorkApp/**"

      # Version 0.66.6.<revision>: the revision counts the commits on main (first parent) since 3d78856,
      # the last commit on main before versioning was introduced. The merge that introduced it is .0,
      # every later commit/merge on main adds 1.
      - name: Compute version
        run: |
          REVISION=$(( $(git rev-list --count --first-parent 3d78856..HEAD) - 1 ))
          if [ "$REVISION" -lt 0 ]; then REVISION=0; fi
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Version 0.66.6.$REVISION"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish
        run: dotnet publish MyFathersWorkApp/MyFathersWorkApp/MyFathersWorkApp.csproj -c Release -p:Version=0.66.6.$REVISION -o publish

      # Base path /<repo>/, index.html hash for the offline service worker, 404.html for deep links, .nojekyll and the
      # narration download list (audio/vo/packs.json). See the script.
      - name: Prepare for GitHub Pages
        run: python3 tools/pages-prepare.py publish/wwwroot ${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
